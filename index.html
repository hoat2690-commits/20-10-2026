<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi Mẹ Yêu - 20/10/2026 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #ffe4e6 0%, #fecdd3 50%, #fda4af 100%);
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      perspective: 1200px;
    }

    /* Hiệu ứng bong bóng / hoa rơi ngẫu nhiên */
    .particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 6s linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0.6);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-15vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* Khung chứa Thiệp 3D */
    .card-wrapper {
      position: relative;
      width: 340px;
      height: 480px;
      z-index: 10;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-wrapper.open {
      transform: rotateY(-160deg);
    }

    .card-front, .card-inside {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(225, 29, 72, 0.25);
      border: 3px solid #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      text-align: center;
      backface-visibility: hidden;
    }

    /* Mặt trước của thiệp */
    .card-front {
      background: linear-gradient(135deg, #ffffff 0%, #fff1f2 100%);
      z-index: 2;
      transform-origin: left;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-front .flower-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 25px rgba(244, 63, 94, 0.4);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
      border: 4px solid #fecdd3;
    }

    .card-front h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 36px;
      color: #e11d48;
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
    }

    .card-front p {
      font-size: 14px;
      color: #9f1239;
      font-weight: 700;
    }

    .click-hint {
      margin-top: 20px;
      font-size: 12px;
      background: #ffe4e6;
      color: #e11d48;
      padding: 8px 16px;
      border-radius: 20px;
      animation: bounce 1.5s infinite;
    }

    /* Mặt trong của thiệp */
    .card-inside {
      background: #ffffff;
      transform: rotateY(180deg);
      border: 3px solid #fecdd3;
      justify-content: space-between;
    }

    .date-badge {
      background: linear-gradient(135deg, #fb7185, #e11d48);
      color: white;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .message-body {
      font-size: 14px;
      color: #4c0519;
      line-height: 1.7;
      text-align: left;
      margin: 15px 0;
    }

    .message-body b {
      color: #e11d48;
    }

    .btn-action {
      background: linear-gradient(135deg, #f43f5e, #be123c);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.3);
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-action:hover {
      transform: scale(1.05);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

  <!-- Hiệu ứng hạt tim bay -->
  <div id="particles"></div>

  <!-- Thiệp 3D -->
  <div class="card-wrapper" onclick="toggleCard()">
    <!-- Mặt Ngoài -->
    <div class="card-front">
      <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=400&q=80" alt="Hoa hồng 3D" class="flower-img">
      <h2>Gửi Mẹ Yêu Thương!</h2>
      <p>20 / 10 / 2026</p>
      <div class="click-hint">✨ Chạm nhẹ để mở thiệp ✨</div>
    </div>

    <!-- Mặt Trong -->
    <div class="card-inside">
      <div class="date-badge">20 OCTOBER 2026</div>
      
      <div class="message-body">
        🌸 <b>Mẹ kính yêu!</b><br><br>
        Nhân ngày Phụ nữ Việt Nam 20/10, con chúc Mẹ luôn tràn đầy sức khỏe, bình an và mãi nở nụ cười rạng rỡ trên môi.<br><br>
        Cảm ơn Mẹ vì tất cả những hy sinh và tình yêu thương vô bờ bến dành cho con! 💕
      </div>

      <button class="btn-action" onclick="surprise(event)">Bấm để nhận quà Mẹ nhé! 🎁</button>
    </div>
  </div>

  <script>
    // Mở / Đóng thiệp 3D
    function toggleCard() {
      const card = document.querySelector('.card-wrapper');
      card.classList.toggle('open');
    }

    // Hiệu ứng pháo hoa bắn tungシュー
    function surprise(e) {
      e.stopPropagation(); // Không đóng thiệp khi bấm nút
      
      // Bắn pháo hoa tim lấp lấp
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#f43f5e', '#fb7185', '#ffe4e6', '#e11d48']
      });

      alert("❤️ Con chúc Mẹ ngày 20/10 thật nhiều niềm vui và luôn là người phụ nữ hạnh phúc nhất thế giới!");
    }

    // Tạo các hạt hoa & tim bay background
    function createParticle() {
      const p = document.createElement('div');
      p.classList.add('particle');
      p.innerHTML = ['🌸', '🌹', '💖', '✨', '💐'][Math.floor(Math.random() * 5)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.fontSize = Math.random() * 15 + 15 + 'px';
      p.style.animationDuration = Math.random() * 3 + 4 + 's';

      document.getElementById('particles').appendChild(p);

      setTimeout(() => p.remove(), 6000);
    }

    setInterval(createParticle, 300);
  </script>
</body>
</html>
